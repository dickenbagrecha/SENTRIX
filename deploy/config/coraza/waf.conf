# ==============================================================================
# SENTRIX Ingress WAF Configuration (Coraza / ModSecurity SecLang)
# ==============================================================================

# Enable the rule engine (DetectionOnly for safe dev, On for active blocking)
SecRuleEngine DetectionOnly

# Request Body Handling
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyInMemoryLimit 131072

# Response Body Handling
SecResponseBodyAccess Off

# Audit Logging Configuration
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/sentrix/coraza-audit.log
SecAuditLogFormat JSON

# JSON and XML Body Processors
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
     "id:'200001',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" \
     "id:'200002',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"

# Basic SQLi, XSS and Traversal Detection Rules
SecRule ARGS "@detectSQLi" \
    "id:1001,phase:2,block,status:403,msg:'SQL Injection Attempt Detected',tag:'attack-sqli',severity:CRITICAL"

SecRule ARGS "@detectXSS" \
    "id:1002,phase:2,block,status:403,msg:'Cross-Site Scripting (XSS) Detected',tag:'attack-xss',severity:HIGH"

SecRule REQUEST_URI "@rx \.\./" \
    "id:1003,phase:1,block,status:403,msg:'Path Traversal Attempt Detected',tag:'attack-traversal',severity:HIGH"
